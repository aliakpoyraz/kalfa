name: Klapa
options:
  bundleIdPrefix: com.aliakpoyraz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Klapa:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Klapa
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliakpoyraz.klapa
        PRODUCT_NAME: Klapa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Klapa/Bridging/Klapa-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Klapa/Resources/Klapa.entitlements
        # Ad-hoc signed. Klapa needs no entitlements — DDC/IOKit and the display
        # configuration API are open to any process — so a developer identity buys
        # nothing locally and only ties the build to a provisioning profile.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "Klapa"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
